services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: trainingdb
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  eureka-server:
    build:
      context: ./eureka-server
    ports:
      - "8761:8761"
    environment:
      EUREKA_INSTANCE_HOSTNAME: eureka-server
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  order-service:
    build:
      context: ./order-service
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/trainingdb
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_SERVER_ADDRESS: http://eureka-server:8761/eureka
      EUREKA_INSTANCE_PREFERIPADDRESS: "true"
    ports:
      - "8282:8282"
    restart: unless-stopped

  payment-service:
    build:
      context: ./payment-service
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/trainingdb
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_SERVER_ADDRESS: http://eureka-server:8761/eureka
    ports:
      - "8383:8383"
    restart: unless-stopped

  product-service:
    build:
      context: ./product-service
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/trainingdb
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_SERVER_ADDRESS: http://eureka-server:8761/eureka
    ports:
      - "8181:8181"
    restart: unless-stopped

  spring-cloud-gateway:
    build:
      context: ./spring-cloud-gateway
    depends_on:
      eureka-server:
        condition: service_healthy
      order-service:
        condition: service_started
      payment-service:
        condition: service_started
      product-service:
        condition: service_started
    environment:
      EUREKA_SERVER_ADDRESS: http://eureka-server:8761/eureka/
    ports:
      - "8484:8484"
    restart: unless-stopped

volumes:
  mysql-data:
