spring:
  application:
    name: SPRING-CLOUD-GATEWAY
    version: sb4.1.1

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/order/**

            - id: payment-service
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/payment/**

            - id: product-service
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/product/**

server:
  port: 8484

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_ADDRESS:http://localhost:8761/eureka/}

  instance:
    hostname: localhost

logging:
  level:
    org.springframework.cloud.gateway: DEBUG